# Home Assistant tests for custom_components/energy_shopper. Needs a venv with
# pytest-homeassistant-custom-component (see tests/peoples_gas/README.md); not part of
# `make unit-test`, which stays on the standard library.
[pytest]
pythonpath = ../..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .
