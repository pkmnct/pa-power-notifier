blueprint:
  name: Energy Shopper — notify when switching gas supplier pays
  description: >
    Sends a notification when Energy Shopper's gas recommendation changes, for example
    when a supplier becomes cheaper than your current rate by your threshold.
  domain: automation
  source_url: https://github.com/pkmnct/pa-power-notifier/blob/main/blueprints/automation/energy_shopper/notify_on_recommendation.yaml
  input:
    notify_action:
      name: Notify action
      description: The notify action to call, such as notify.mobile_app_your_phone.
      default: notify.notify
      selector:
        text: {}
    include_stay:
      name: Also notify when it goes back to "stay"
      default: false
      selector:
        boolean: {}

triggers:
  - trigger: event
    event_type: energy_shopper_recommendation_changed

variables:
  include_stay: !input include_stay
  e: "{{ trigger.event.data }}"

conditions:
  - condition: template
    value_template: "{{ e.recommendation == 'switch' or include_stay }}"

actions:
  - action: !input notify_action
    data:
      title: >-
        {% if e.recommendation == 'switch' %}Cheaper gas: {{ e.supplier }}{% else %}Gas: stay on your current rate{% endif %}
      message: >-
        {% if e.recommendation == 'switch' %}
        {{ e.supplier }} ({{ e.plan_type }}, {{ e.term }}) is ${{ '%.4f' % e.price }}/{{ e.unit }}
        vs your ${{ '%.4f' % e.current_price }}/{{ e.unit }}, about ${{ '%.0f' % e.annual_savings }}/yr
        ({{ '%.0f' % e.savings_pct }}%) less.{% if e.phone %} Call {{ e.phone }}.{% endif %}
        {% else %}
        No offer beats your current rate by your threshold any more.
        {% endif %}
